<!doctype html>
<html lang="en">
<head>
<!--TAILORLIST_HEAD-->
<style>
  .redirect { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
</style>
</head>
<body class="narrow">
<!--TAILORLIST_BRAND-->
<h1>Connect Tailorlist to your Spotify</h1>
<p class="lead">Set up once, in about 3 minutes. Follow the steps, then paste your Client ID at the bottom.</p>
<div class="card accent intro">{{INTRO}}</div>
{{STEPS}}
<div class="actions">
  <a class="btn" href="https://developer.spotify.com/dashboard" target="_blank" rel="noopener">Open the Spotify dashboard</a>
  <span class="redirect">Redirect URI: <code id="redirect">{{REDIRECT}}</code><button class="small" type="button" id="copy" hidden>Copy</button></span>
</div>
<form method="post" action="/setup">
  <label for="client_id">Your Client ID</label>
  {{ERROR}}
  <input type="text" id="client_id" name="client_id" value="{{VALUE}}" autocomplete="off" spellcheck="false" placeholder="32 letters and digits" required>
  <input type="hidden" name="token" value="{{TOKEN}}">
  <button type="submit">Save and connect to Spotify</button>
</form>
<details>
  <summary>Something went wrong?</summary>
  <ul>{{TROUBLE}}</ul>
</details>
<!--TAILORLIST_FOOTER-->
<script>
  var b = document.getElementById("copy");
  if (b && navigator.clipboard) {
    b.hidden = false;
    b.onclick = function () {
      navigator.clipboard.writeText(document.getElementById("redirect").textContent).then(function () {
        b.textContent = "Copied";
        setTimeout(function () { b.textContent = "Copy"; }, 1500);
      });
    };
  }
</script>
</body>
</html>
