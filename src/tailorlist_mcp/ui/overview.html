<!doctype html>
<html lang="en">
<head>
<!--TAILORLIST_HEAD-->
</head>
<body>
<!--TAILORLIST_BRAND-->
<div id="app"><div class="empty">Loading your collection…</div></div>
<!--TAILORLIST_FOOTER-->
<script id="tailorlist-data" type="application/json">null</script>
<script>
(() => {
  // ---------------------------------------------------------------- MCP Apps bridge
  let nextId = 1;
  const pending = new Map();
  const send = (msg) => window.parent.postMessage(msg, "*");
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++;
    pending.set(id, { resolve, reject });
    send({ jsonrpc: "2.0", id, method, params });
  });
  const notify = (method, params) => send({ jsonrpc: "2.0", method, params: params || {} });
  const openLink = (url) => request("ui/open-link", { url }).catch(() => {});

  function reportSize() {
    const el = document.documentElement;
    notify("ui/notifications/size-changed", { width: el.scrollWidth, height: el.scrollHeight });
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id !== undefined && !msg.method && pending.has(msg.id)) {
      const { resolve, reject } = pending.get(msg.id);
      pending.delete(msg.id);
      msg.error ? reject(msg.error) : resolve(msg.result);
      return;
    }
    if (msg.method === "ui/notifications/tool-result") {
      const result = msg.params || {};
      let data = result.structuredContent;
      if (!data && result.content && result.content[0] && result.content[0].text) {
        try { data = JSON.parse(result.content[0].text); } catch (e) {}
      }
      if (data) render(data);
    } else if (msg.method === "ui/resource-teardown" && msg.id !== undefined) {
      send({ jsonrpc: "2.0", id: msg.id, result: {} });
    }
  });

  document.addEventListener("click", (e) => {
    const a = e.target.closest("a[data-url]");
    if (a) { e.preventDefault(); openLink(a.dataset.url); }
  });

  // ---------------------------------------------------------------- helpers
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const fmt = (n) => (typeof n === "number" ? n.toLocaleString("en-US") : (n ?? "—"));
  // Inside Claude (MCP App) links go through ui/open-link; as a standalone page they are plain links.
  const standalone = window.parent === window;
  const link = (text, url) => !url ? esc(text)
    : standalone ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>`
    : `<a data-url="${esc(url)}" href="#">${esc(text)}</a>`;
  const medals = ["🥇", "🥈", "🥉", "4.", "5."];

  const kpi = (icon, label, value, sub) =>
    `<div class="card"><div class="icon">${icon}</div><div class="label">${label}</div>
     <div class="value">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;

  function bars(items, nameOf, valueOf, urlOf) {
    items = [...items].sort((a, b) => valueOf(b) - valueOf(a));
    const max = Math.max(1, ...items.map(valueOf));
    return `<div class="bars">${items.map((it) => `
      <div class="row"><div class="name" title="${esc(nameOf(it))}">${link(nameOf(it), urlOf && urlOf(it))}</div>
      <div class="track"><div class="fill" style="width:${(valueOf(it) / max * 100).toFixed(1)}%"></div></div>
      <div class="num">${fmt(valueOf(it))}</div></div>`).join("")}</div>`;
  }

  function columns(items, labelOf, valueOf, dense) {
    const max = Math.max(1, ...items.map(valueOf));
    const labels = items.length <= 12;
    return `<div class="cols${dense ? " dense" : ""}">${items.map((it) => `
      <div class="col" title="${esc(labelOf(it))}: ${fmt(valueOf(it))}"><div class="bar" style="height:${(valueOf(it) / max * 100).toFixed(1)}%">${labels ? `<span>${fmt(valueOf(it))}</span>` : ""}</div>
      <div class="lab">${esc(labelOf(it))}</div></div>`).join("")}</div>`;
  }

  function ranking(items, titleOf, subOf, valueOf, footOf, maxValue) {
    return items.map((it, i) => `
      <div class="rank"><div class="top"><span>${medals[i] || ""} ${titleOf(it)}</span><span class="v">${valueOf(it)}</span></div>
      ${subOf ? `<div class="sub">${subOf(it)}</div>` : ""}
      <div class="meter"><div style="width:${Math.min(100, it._bar / maxValue * 100).toFixed(0)}%"></div></div>
      <div class="foot">${footOf(it)}</div></div>`).join("");
  }

  function genreChips(genres) {
    const max = Math.max(1, ...genres.map((g) => g.tracks));
    return `<div class="chips">${genres.map((g) => {
      const a = 0.1 + 0.45 * (g.tracks / max);
      return `<span class="chip heat" style="--a:${a.toFixed(2)}">${esc(g.genre)}<b>${fmt(g.tracks)}</b></span>`;
    }).join("")}</div>`;
  }

  function timeline(points) {
    if (!points.length) return "";
    const w = 700, h = 150, pad = 18;
    const max = Math.max(1, ...points.map((p) => p.tracks));
    const step = (w - pad * 2) / Math.max(1, points.length - 1);
    const xy = points.map((p, i) => [pad + i * step, h - pad - (p.tracks / max) * (h - pad * 2)]);
    const line = xy.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
    const area = `${line} L${xy[xy.length - 1][0].toFixed(1)},${h - pad} L${pad},${h - pad} Z`;
    const first = points[0].month, last = points[points.length - 1].month;
    return `<svg class="timeline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <path class="tl-area" d="${area}"/><path class="tl-line" d="${line}" vector-effect="non-scaling-stroke"/>
      </svg><div class="sub axis"><span>${esc(first)}</span><span>peak ${fmt(max)} tracks in a month</span><span>${esc(last)}</span></div>`;
  }

  function dupTable(items, cols) {
    if (!items.length) return `<div class="sub">None.</div>`;
    return `<table><tr>${cols.map((c) => `<th>${c[0]}</th>`).join("")}</tr>${items.map((it) =>
      `<tr>${cols.map((c) => `<td>${esc(it[c[1]])}</td>`).join("")}</tr>`).join("")}</table>`;
  }

  // ---------------------------------------------------------------- render
  function render(data) {
    const app = document.getElementById("app");
    document.getElementById("demo-badge").hidden = !data.demo;
    if (data.empty || !data.kpis) {
      app.innerHTML = `<div class="empty">Nothing loaded yet. Ask Claude to load some playlists.</div>`;
      reportSize();
      return;
    }
    const k = data.kpis, li = data.listening, d = data.duplicates;
    let html = "";

    if (data.load) {
      const loaded = data.load.filter((r) => r.status === "loaded").length;
      const same = data.load.filter((r) => r.status === "unchanged").length;
      const errors = data.load.filter((r) => r.status === "error").length;
      html += `<div class="loaded">Loaded ${loaded} playlist${loaded === 1 ? "" : "s"}${same ? ` · ${same} unchanged` : ""}${errors ? ` · ${errors} failed` : ""}</div>`;
    }

    html += `<div class="grid kpis">
      ${kpi("🎵", "Unique tracks", fmt(k.unique_tracks), `${fmt(k.entries)} playlist entries`)}
      ${kpi("🎤", "Artists", fmt(k.artists), "primary artists only")}
      ${kpi("📂", "Playlists", fmt(k.playlists), `${fmt(k.hours)} hours of music`)}
      ${kpi("⭐", "Avg popularity", k.avg_popularity ?? "N/A", "Spotify 0–100")}
      ${kpi("📅", "Top decade", k.top_decade ? k.top_decade + "s" : "N/A")}
      ${kpi("⏱️", "Avg duration", k.avg_duration ?? "N/A")}
    </div>`;

    if (data.oldest && data.newest) {
      html += `<div class="grid two" style="margin-top:10px">
        <div class="card"><div class="label">🕰️ Oldest track</div><div class="big">${link(data.oldest.name, data.oldest.url)}</div>
          <div class="sub">${esc(data.oldest.artist)}</div><div class="year">${data.oldest.year}</div></div>
        <div class="card"><div class="label">✨ Newest track</div><div class="big">${link(data.newest.name, data.newest.url)}</div>
          <div class="sub">${esc(data.newest.artist)}</div><div class="year">${data.newest.year}</div></div>
      </div>`;
    }
    if (li) {
      html += `<div class="card" style="margin-top:10px"><div class="stats">
        <div><div class="label">Median era</div><div class="v hot">${li.median_year}</div></div>
        <div><div class="label">Span</div><div class="v">${li.span} yrs</div></div>
        <div><div class="label">Listening age</div><div class="v hot">${li.listening_age} yrs</div></div>
        </div><div class="sub" style="margin-top:8px">Median era ${li.median_year} · est. born ${li.est_birth} · Listening Age ${li.listening_age} yrs</div></div>`;
    }

    html += `<h2>Tracks per playlist</h2><p class="hint">Every saved entry counts, so a track in two playlists counts in both.</p>`;
    html += bars(data.playlists, (p) => p.name, (p) => p.tracks, (p) => p.url);

    html += `<h2>Top 20 artists</h2><p class="hint">Unique tracks per primary artist.</p>`;
    html += bars(data.top_artists, (a) => a.name, (a) => a.tracks);

    if (data.decades.length) {
      html += `<h2>Collection by decade</h2><p class="hint">Unique tracks by the album's release year.</p>`;
      html += columns(data.decades, (x) => x.decade + "s", (x) => x.tracks);
    }
    if (data.popularity.length) {
      html += `<h2>Popularity distribution</h2><p class="hint">Spotify popularity of each unique track, in steps of 5.</p>`;
      html += columns(data.popularity, (x) => x.from, (x) => x.tracks, true);
    }

    html += `<div class="grid two" style="margin-top:6px">`;
    if (data.popular_artists.length) {
      const pa = data.popular_artists.map((a) => ({ ...a, _bar: a.popularity }));
      html += `<div><h2>🏆 Most popular artists</h2><p class="hint">Average popularity, artists with at least ${data.min_tracks_for_popular} tracks.</p>
        ${ranking(pa, (a) => esc(a.name), null, (a) => a.popularity, (a) => `${a.tracks} tracks`, 100)}</div>`;
    }
    if (data.top_albums.length) {
      const maxT = Math.max(...data.top_albums.map((a) => a.tracks));
      const al = data.top_albums.map((a) => ({ ...a, _bar: a.tracks }));
      html += `<div><h2>💿 Favourite albums</h2><p class="hint">Most tracks saved from one album.</p>
        ${ranking(al, (a) => esc(a.album), (a) => esc(a.artist), (a) => `${a.tracks} track${a.tracks === 1 ? "" : "s"}`, (a) => `avg popularity ${a.popularity}`, maxT)}</div>`;
    }
    html += `</div>`;

    if (data.genres.length) {
      html += `<h2>Top genres</h2><p class="hint">Spotify tags of the primary artist. Sub-genres count too: "rock" includes "indie rock".
        ${data.untagged.tracks ? `${fmt(data.untagged.tracks)} tracks (${data.untagged.percent}%) have no genre.` : ""}
        ${data.musicbrainz && data.musicbrainz.filled ? `${fmt(data.musicbrainz.filled)} artists got their genres from MusicBrainz (Spotify had none).` : ""}</p>`;
      html += genreChips(data.genres);
    }

    if (data.timeline.length) {
      html += `<h2>Tracks added over time</h2><p class="hint">Unique tracks added per month.</p>${timeline(data.timeline)}`;
    }

    html += `<h2>Duplicates</h2><p class="hint">${fmt(d.tracks_in_several_playlists)} tracks are in more than one playlist.</p>
      <div class="grid two">
        <div class="card"><div class="label">Same Spotify track saved more than once</div><div class="value">${fmt(d.exact.count)}</div>
          <div style="margin-top:10px">${dupTable(d.exact.items, [["Track", "track"], ["Artist", "artist"], ["Saved in", "playlists"]])}</div></div>
        <div class="card"><div class="label">Same song, different versions</div><div class="value">${fmt(d.versions.count)}</div>
          <div class="sub">Same name and artist under different Spotify IDs (album vs. compilation, remaster…)</div>
          <div style="margin-top:10px">${dupTable(d.versions.items, [["Track", "track"], ["Artist", "artist"], ["Saved in", "playlists"]])}</div></div>
      </div>`;

    html += ``;
    app.innerHTML = html;
    reportSize();
  }

  if (standalone) {
    let embedded = null;
    try { embedded = JSON.parse(document.getElementById("tailorlist-data").textContent); } catch (e) {}
    if (embedded) render(embedded);
    return;
  }

  new ResizeObserver(reportSize).observe(document.body);

  request("ui/initialize", {
    protocolVersion: "2025-06-18",
    appInfo: { name: "tailorlist-overview", version: "0.1.0" },
    appCapabilities: {},
  }).then(() => notify("ui/notifications/initialized"))
    .catch(() => {});
})();
</script>
</body>
</html>
